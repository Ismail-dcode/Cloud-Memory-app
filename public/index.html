<!DOCTYPE html>
<html>
<head>
    <title>S3 Image Upload</title>
</head>

<body>

    <h1>Upload Image to S3</h1>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="image"
            accept="image/*"
            required
        >

        <button type="submit">
            Upload
        </button>

    </form>

</body>
</html>
